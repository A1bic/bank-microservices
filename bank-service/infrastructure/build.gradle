description = 'Adapters: PostgreSQL persistence (JPA + Flyway), Kafka exchange rate consumer, startup data'

dependencies {
    implementation project(':bank-service:application')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation libs.mapstruct.core

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.lombok.mapstruct.binding
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Amapstruct.unmappedTargetPolicy=ERROR'
}
