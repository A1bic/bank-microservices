name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Integration tests start PostgreSQL with Testcontainers, Docker is available on GitHub runners
      - name: Build and run tests
        run: ./gradlew build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build
