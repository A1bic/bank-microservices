plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

// ':bank-service' is only a folder that groups the layers, it has no code of its own
def javaModules = subprojects - project(':bank-service')

configure(javaModules) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    group = 'ru.kovalenko'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            // All Spring-managed versions come from the Spring Boot BOM matching the plugin version
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    configurations {
        mockitoAgent
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testImplementation 'org.mockito:mockito-junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        mockitoAgent('org.mockito:mockito-core') {
            transitive = false
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Load Mockito as an agent explicitly: dynamic agent loading is going away in newer JDKs
        jvmArgs += ["-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off']
    }
}
